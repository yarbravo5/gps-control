name: Keep Render warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://gps-control-api-yb.onrender.com/health
